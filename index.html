<style id="player-css">
.vp{--ink:#0f172a;--muted:#64748b;--ok:#16a34a;--bad:#dc2626;--pri:#2563eb;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:#0b1020;max-width:1100px;margin:0 auto;position:relative;border-radius:14px;padding:10px;-webkit-user-select:none;user-select:none}

.vp-title{font-weight:700;font-size:15px;opacity:.95}
.vp-stage{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:10px}
.vp-media{position:absolute;inset:0}
.vp-media video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
.vp-yt{position:absolute;inset:0}
.vp-yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.vp-yt.vp-int iframe{pointer-events:auto}
.vp-click{position:absolute;inset:0;cursor:pointer}
.vp-layer{position:absolute;inset:0;pointer-events:none}
.vp-quiz{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,10,25,.74);pointer-events:auto;padding:8px}
.vp-card{background:#fff;color:var(--ink);border-radius:14px;padding:16px 18px;width:min(680px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.vp-card h2{margin:0 0 6px;font-size:20px}
.vp-card p{margin:4px 0 10px;color:var(--muted);font-size:14px}
.vp-card label{display:block;font-size:13px;font-weight:600;margin:8px 0 2px;color:#334155}
.vp-card input[type=text]{width:100%;padding:10px 12px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:16px;color:var(--ink);background:#fff;-webkit-user-select:text;user-select:text}
.vp-card input[type=text]:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.vp-card-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.vp-chip{border:0;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;background:#e2e8f0;color:#334155;cursor:pointer;font-family:inherit}
.vp-chip.blue{background:#2563eb;color:#fff;cursor:default}
.vp-q{font-size:18px;font-weight:700;line-height:1.45;margin:6px 0 12px;text-align:center}
.vp-var{color:#1d4ed8}
.vp-q.long{text-align:left;font-size:16px;font-weight:600}
.vp-imgs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 12px}
.vp-imgs img{max-width:100%;max-height:34vh;border-radius:8px;border:1px solid #e2e8f0;background:#fff}
.vp-card mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle}
.vp-card mjx-container[display="true"]{margin:.4em 0!important}
.vp-opt span{min-width:0}
.vp-fb small mjx-container{color:inherit}
.vp-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.vp-opts{grid-template-columns:1fr}.vp-q{font-size:16px}}
.vp-opt{display:flex;align-items:center;gap:10px;border:2px solid;border-radius:12px;padding:10px 12px;font-size:15px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);background:#fff}
.vp-opt b{flex:none;width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.vp-opt.c0{background:#fee2e2;border-color:#fca5a5}.vp-opt.c0 b{background:#ef4444}
.vp-opt.c1{background:#dbeafe;border-color:#93c5fd}.vp-opt.c1 b{background:#3b82f6}
.vp-opt.c2{background:#fef3c7;border-color:#fcd34d}.vp-opt.c2 b{background:#d97706}
.vp-opt.c3{background:#dcfce7;border-color:#86efac}.vp-opt.c3 b{background:#16a34a}
.vp-opt.c4,.vp-opt.c5{background:#ede9fe;border-color:#c4b5fd}.vp-opt.c4 b,.vp-opt.c5 b{background:#7c3aed}
.vp-opt:disabled{cursor:default}
.vp-opt.good{background:#16a34a!important;border-color:#15803d!important;color:#fff}
.vp-opt.bad{background:#fecaca!important;border-color:#dc2626!important;text-decoration:line-through;opacity:.8}
.vp-opt.dim{opacity:.45}

.vp-tfrow{display:flex;align-items:center;gap:10px;border:2px solid #cbd5e1;border-radius:12px;padding:8px 10px;background:#fff;font-size:15px}

.vp-tft{flex:1;min-width:0}

.vp-tfb:disabled{cursor:default;opacity:.85}
@media(max-width:560px){.vp-tfrow{flex-wrap:wrap}.vp-tft{flex-basis:calc(100% - 40px)}}
.vp-btn2{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:10px 18px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.vp-btn2.green{background:var(--ok)}.vp-btn2.gray{background:#64748b}
.vp-btn2:disabled{opacity:.5;cursor:default}
.vp-btn2{white-space:nowrap}

.vp-fb .good{color:var(--ok)}.vp-fb .bad{color:var(--bad)}

.vp-fb .vp-btn2{margin-top:6px}
.vp-bar{display:flex;align-items:center;gap:10px;padding:10px 4px 2px}
.vp-btn{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:8px;width:36px;height:34px;font-size:15px;cursor:pointer;flex:none;font-family:inherit}
.vp-btn:hover{background:rgba(255,255,255,.22)}
.vp-prog{position:relative;flex:1;height:10px;background:rgba(255,255,255,.2);border-radius:99px;cursor:pointer}
.vp-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#f97316,#fb923c);border-radius:99px;width:0}
.vp-limit{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.35) 0 4px,rgba(0,0,0,.15) 4px 8px);border-radius:0 99px 99px 0}
.vp-mark{position:absolute;top:-3px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:#fbbf24}
.vp-mark.done{background:#22c55e}
.vp-time{font-size:12px;opacity:.85;white-space:nowrap;min-width:78px;text-align:right}
.vp-qc{font-size:12px;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:99px;white-space:nowrap}
.vp-conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.vp-conf i{position:absolute;top:-12px;width:8px;height:13px;animation:vpfall 1.7s ease-in forwards}
@keyframes vpfall{to{top:105%;transform:rotate(600deg);opacity:.2}}
.vp-end .vp-big{font-size:42px;text-align:center}
.vp-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.vp-stats div{background:#f1f5f9;border-radius:10px;padding:8px 10px;font-size:13px;color:#475569}
.vp-stats b{display:block;font-size:20px;color:var(--ink)}
.vp-code{width:100%;height:64px;font-family:ui-monospace,Consolas,monospace;font-size:11px;border:1.5px solid #cbd5e1;border-radius:8px;padding:6px;color:#334155;-webkit-user-select:text;user-select:text;resize:none}
.vp:fullscreen{max-width:none;border-radius:0;display:flex;flex-direction:column;justify-content:center;height:100%}
.vp:fullscreen .vp-stage{aspect-ratio:auto;flex:1;min-height:0}
.vp-err{padding:20px;text-align:center;color:#fecaca}
@media(max-width:560px){
  .vp{padding:6px;border-radius:0}
  .vp-stage{aspect-ratio:auto;height:64vh;min-height:380px}
  .vp-bar{flex-wrap:wrap}.vp-prog{order:5;flex:1 1 100%}.vp-time{min-width:0;margin-left:auto}
}

<script id="player-js">
function PlayerModule(){
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
  function rngFrom(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
  function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const x=a[i];a[i]=a[j];a[j]=x;}return a;}
  function fmtT(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
  function parseT(s){s=String(s).trim().replace(',','.');if(/^\d+(\.\d+)?$/.test(s))return parseFloat(s);const p=s.split(':').map(Number);if(p.some(isNaN)||p.length>3||p.length<2)return NaN;return p.reduce((a,b)=>a*60+b,0);}
  function b64e(s){const b=new TextEncoder().encode(s);let bin='';b.forEach(x=>{bin+=String.fromCharCode(x);});return btoa(bin);}
  function b64d(s){const bin=atob(s);const b=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(b);}

  /* ---- Biểu thức an toàn (chỉ cho phép tên có trong "scope", không dấu chấm truy cập, không chuỗi) ---- */
  function baseEnv(rng){
    const I=n=>Math.trunc(n);
    return {
      randint:(a,b)=>a+Math.floor(rng()*(b-a+1)),
      pick:(...x)=>x[Math.floor(rng()*x.length)],
      floor:Math.floor,ceil:Math.ceil,round:Math.round,trunc:Math.trunc,abs:Math.abs,min:Math.min,max:Math.max,
      sqrt:Math.sqrt,pow:Math.pow,log2:Math.log2,log10:Math.log10,PI:Math.PI,
      bin:n=>I(n).toString(2),hex:n=>I(n).toString(16).toUpperCase(),oct:n=>I(n).toString(8),
      pad:(s,n)=>String(s).padStart(n,'0'),len:s=>String(s).length,
      parseBin:s=>parseInt(String(s),2),parseHex:s=>parseInt(String(s),16)
    };
  }
  function evalExpr(expr,scope){
    expr=String(expr).trim();
    if(!expr)throw new Error('Biểu thức rỗng');
    if(!/^[\w\s+\-*\/%().,<>=!&|?:]*$/.test(expr))throw new Error('Có ký tự không được phép trong: '+expr);
    if(/(^|[^\d])\.|\.($|[^\d])/.test(expr))throw new Error('Không dùng dấu chấm kiểu a.b');
    if(/=>/.test(expr)||/(^|[^=!<>])=($|[^=])/.test(expr))throw new Error('Không dùng phép gán hoặc hàm mũi tên');
    const ids=expr.match(/(?<![\w])[A-Za-z_]\w*/g)||[];
    for(const id of ids){if(!Object.prototype.hasOwnProperty.call(scope,id))throw new Error('Tên chưa khai báo: '+id);}
    const keys=Object.keys(scope);
    return new Function(...keys,'"use strict";return ('+expr+');')(...keys.map(k=>scope[k]));
  }
  function genScope(vspec,rng){
    const scope=baseEnv(rng),vars=new Set();
    Object.defineProperty(scope,'__vars',{value:vars,enumerable:false});
    String(vspec||'').split(/\n/).forEach(line=>{
      line=line.trim();if(!line||line[0]==='#')return;
      const m=line.match(/^([A-Za-z_]\w*)\s*=\s*(.+)$/);
      if(!m)throw new Error('Dòng khai báo biến sai: '+line);
      scope[m[1]]=evalExpr(m[2],scope);vars.add(m[1]);
    });
    return scope;
  }
  function fmtVal(v){if(typeof v==='number'&&isFinite(v)&&!Number.isInteger(v))v=+v.toFixed(10);return String(v);}
  function lookup(eq,key,scope){
    key=key.trim();
    try{if(eq)return{v:evalExpr(key,scope)};if(scope.__vars&&scope.__vars.has(key))return{v:scope[key]};}catch(e){}
    return null;
  }
  /* Tách văn bản thành phần chữ và phần công thức ($...$, $$...$$, \(...\), \[...\]) */
  function splitMath(text){
    const out=[];let i=0,buf='';
    while(i<text.length){
      if(text[i]==='\\'&&text[i+1]==='$'){buf+='\\$';i+=2;continue;}
      let open=null,close=null;
      if(text.startsWith('$$',i)){open='$$';close='$$';}
      else if(text[i]==='$'){open='$';close='$';}
      else if(text.startsWith('\\(',i)){open='\\(';close='\\)';}
      else if(text.startsWith('\\[',i)){open='\\[';close='\\]';}
      if(open){const end=text.indexOf(close,i+open.length);
        if(end>i+open.length){if(buf)out.push({math:false,s:buf});buf='';out.push({math:true,s:text.slice(i,end+close.length)});i=end+close.length;continue;}}
      buf+=text[i++];
    }
    if(buf)out.push({math:false,s:buf});
    return out;
  }
  function textHtml(s,scope){
    let out='',last=0,m;const re=/\{(=?)([^{}]+)\}/g;
    while((m=re.exec(s))){
      const r=lookup(m[1],m[2],scope);
      out+=esc(s.slice(last,m.index))+(r?'<b class="vp-var">'+esc(fmtVal(r.v))+'</b>':esc(m[0]));last=re.lastIndex;
    }
    return(out+esc(s.slice(last))).replace(/\n/g,'<br>');
  }
  function fmtText(text,scope){
    scope=scope||genScope('',Math.random);
    return splitMath(String(text==null?'':text)).map(p=>p.math
      ?esc(p.s.replace(/\{(=?)([^{}]+)\}/g,(m0,eq,key)=>{const r=lookup(eq,key,scope);return r?fmtVal(r.v):m0;}))
      :textHtml(p.s,scope)).join('');
  }
  function hasMath(text){return splitMath(String(text||'')).some(p=>p.math);}
  function numOf(s){
    s=String(s==null?'':s).replace(/\$/g,'').replace(/\s+/g,'').replace(/^\\?\(|\\?\)$/g,'');
    if(/^[-+]?\d+([.,]\d+)?$/.test(s))return parseFloat(s.replace(',','.'));
    if(/^[-+]?\d*[.,]\d+$/.test(s))return parseFloat(s.replace(',','.'));
    const f=s.match(/^([-+]?\d+)\/(\d+)$/);if(f&&+f[2])return f[1]/f[2];
    return NaN;
  }
  function compare(ans,input,tol){
    input=String(input==null?'':input).trim();
    const a=typeof ans==='number'?ans:numOf(ans),x=numOf(input);
    if(isFinite(a))return isFinite(x)&&Math.abs(x-a)<=(Number(tol)||0)+1e-9;
    const n=s=>String(s).replace(/\$/g,'').replace(/\s+/g,'').replace(/\\left|\\right/g,'').toLowerCase();
    return n(input)===n(ans);
  }
  /* Hiển thị công thức bằng MathJax (nếu trang đã nạp MathJax) */
  function typeset(el){
    if(!el)return;
    const MJ=typeof window!=='undefined'&&window.MathJax;
    if(MJ&&MJ.typesetPromise){typeset.p=(typeset.p||(MJ.startup&&MJ.startup.promise)||Promise.resolve()).then(()=>MJ.typesetPromise([el])).catch(()=>{});return;}
    (typeset.q=typeset.q||[]).push(el);
    if(!typeset.t)typeset.t=setInterval(()=>{if(window.MathJax&&window.MathJax.typesetPromise){clearInterval(typeset.t);typeset.t=0;const q=typeset.q;typeset.q=[];q.forEach(e=>{if(e.isConnected)typeset(e);});}},300);
  }
  /* Tạo một "bản thể" câu hỏi từ khuôn câu + hạt giống (mỗi học sinh một hạt giống khác nhau) */
  function instantiate(q,seedStr,shuffleOn){
    const rng=rngFrom(hash(seedStr));
    const scope=genScope(q.vars,rng);
    const explain=q.explain?fmtText(q.explain,scope):'';
    const images=(q.images||[]).filter(Boolean),html=fmtText(q.text,scope);
    const long=String(q.text||'').length>140||/\n/.test(String(q.text||'').trim());
    const base={html,explain,images,long};
    if(q.kind==='param'){
      const ans=evalExpr(q.answer,scope);
      return Object.assign(base,{kind:'param',check:s=>compare(ans,s,q.tol),correct:fmtVal(ans),numeric:typeof ans==='number'});
    }
    if(q.kind==='short'){
      const alts=String(q.answer==null?'':q.answer).split('|').map(x=>x.trim()).filter(Boolean);
      if(!alts.length)throw new Error('Chưa có đáp án');
      return Object.assign(base,{kind:'param',check:s=>alts.some(a=>compare(a,s,q.tol)),correct:alts.join(' | '),numeric:alts.every(a=>isFinite(numOf(a)))});
    }
    if(q.kind==='tf'){
      const st=(q.statements||[]).filter(s=>String(s.text||'').trim());
      if(st.length<2)throw new Error('Cần ít nhất 2 ý');
      const answers=st.map(s=>!!s.ok);
      return Object.assign(base,{kind:'tf',statements:st.map(s=>fmtText(s.text,scope)),answers:answers,
        wrongCount:picks=>answers.reduce((n,a,k)=>n+(picks&&picks[k]===a?0:1),0),
        correct:answers.map((a,k)=>String.fromCharCode(97+k)+') '+(a?'Đúng':'Sai')).join(' · ')});
    }
    let ops=(q.options||[]).map(o=>({t:o.text,ok:!!o.ok}));
    if(shuffleOn!==false)ops=shuffle(ops,rng);
    return Object.assign(base,{kind:'mcq',options:ops.map(o=>fmtText(o.t,scope)),correctIdx:ops.findIndex(o=>o.ok)});
  }

  /* ---- Bộ điều khiển video: HTML5 và YouTube dùng chung một giao diện ---- */
  function html5Adapter(box,url,interactive){
    const v=document.createElement('video');v.setAttribute('playsinline','');v.preload='auto';v.controls=!!interactive;v.src=url;box.appendChild(v);
    return{kind:'file',el:v,
      ready:new Promise(r=>{if(v.readyState>=1)r();else{v.addEventListener('loadedmetadata',()=>r(),{once:true});v.addEventListener('error',()=>r(),{once:true});}}),
      play:()=>{const p=v.play();if(p&&p.catch)p.catch(()=>{});},pause:()=>v.pause(),time:()=>v.currentTime||0,seek:t=>{v.currentTime=t;},
      dur:()=>isFinite(v.duration)?v.duration:0,playing:()=>!v.paused&&!v.ended,setMuted:m=>{v.muted=m;},isMuted:()=>v.muted,
      onEnded:cb=>v.addEventListener('ended',cb),failed:()=>!!v.error,destroy:()=>{v.pause();v.removeAttribute('src');v.load();}};
  }
  function ytAdapter(box,id,interactive){
    const holder=document.createElement('div');holder.className='vp-yt'+(interactive?' vp-int':'');
    const target=document.createElement('div');holder.appendChild(target);box.appendChild(holder);
    let player=null;const ends=[];
    const ready=new Promise(resolve=>{
      const make=()=>{player=new YT.Player(target,{videoId:id,playerVars:{controls:interactive?1:0,disablekb:interactive?0:1,rel:0,modestbranding:1,playsinline:1,fs:interactive?1:0,iv_load_policy:3},
        events:{onReady:()=>resolve(),onStateChange:e=>{if(e.data===0)ends.forEach(f=>f());},onError:()=>resolve()}});};
      if(window.YT&&window.YT.Player)make();
      else{
        const prev=window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady=()=>{if(prev)prev();make();};
        if(!document.getElementById('yt-api')){const s=document.createElement('script');s.id='yt-api';s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);}
      }
    });
    return{kind:'youtube',el:holder,ready,
      play:()=>player&&player.playVideo&&player.playVideo(),pause:()=>player&&player.pauseVideo&&player.pauseVideo(),
      time:()=>(player&&player.getCurrentTime)?player.getCurrentTime():0,seek:t=>player&&player.seekTo&&player.seekTo(t,true),
      dur:()=>(player&&player.getDuration)?player.getDuration():0,playing:()=>!!(player&&player.getPlayerState&&player.getPlayerState()===1),
      setMuted:m=>{if(player&&player.mute){m?player.mute():player.unMute();}},isMuted:()=>!!(player&&player.isMuted&&player.isMuted()),
      onEnded:cb=>ends.push(cb),failed:()=>false,destroy:()=>{try{player&&player.destroy();}catch(e){}}};
  }
  function createAdapter(box,video,interactive){
    if(video&&video.type==='youtube')return ytAdapter(box,video.id,interactive);
    return html5Adapter(box,video&&video.url||'',interactive);
  }

  /* ---- Trình phát cho học sinh ---- */

    function updateUI(){

      if(opts.preview&&ni)ni.value='Học sinh thử';
      const arm=()=>{go.disabled=false;go.textContent='Bắt đầu ▶';};
      if(ad)ad.ready.then(()=>{ready=true;if(ad.failed&&ad.failed()){layer.querySelector('.vp-msg').textContent='Không tải được video. Kiểm tra file video có nằm cạnh file HTML không.';go.textContent='Không tải được video';return;}arm();});
      const begin=()=>{
        if(go.disabled)return;
        if(ni&&!ni.value.trim()){layer.querySelector('.vp-msg').textContent='Em hãy nhập họ và tên.';ni.focus();return;}
        name=ni?ni.value.trim():'';cls=ci?ci.value.trim():'';
        seedBase=(lesson.salt||lesson.title||'')+'|'+(name?(name+'|'+cls).toLowerCase():String(Math.random()));
        started=true;t0=Date.now();closeQuiz();ad.seek(0);ad.play();
      };
      go.onclick=begin;[ni,ci].forEach(e=>{if(e)e.addEventListener('keydown',ev=>{if(ev.key==='Enter')begin();});});
    }

    let timer=null;
    if(ad){
      ad.onEnded(()=>{if(!started||finished)return;if(idx<cps.length)openQuiz(idx);else finish();});
      timer=setInterval(tick,100);
      q('.vp-click').onclick=()=>{if(!started||quizOpen||finished)return;ad.playing()?ad.pause():ad.play();setTimeout(updatePlayBtn,60);};
      q('.vp-play').onclick=()=>{if(!started||quizOpen||finished)return;ad.playing()?ad.pause():ad.play();setTimeout(updatePlayBtn,60);};
      q('.vp-mute').onclick=function(){const m=!ad.isMuted();ad.setMuted(m);this.textContent=m?'🔇':'🔊';};
      q('.vp-fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else if(root.requestFullscreen)root.requestFullscreen();};
      prog.onclick=e=>{
        if(!started||quizOpen||finished)return;const d=ad.dur();if(!d)return;
        const r=prog.getBoundingClientRect();let t=(e.clientX-r.left)/r.width*d;
        const lim=idx<cps.length?Math.max(0,cps[idx].t-0.3):d;ad.seek(Math.max(0,Math.min(t,lim)));
      };
    }
    function destroy(){clearInterval(timer);if(ad)ad.destroy();}
    showStart();
    return{destroy,_state:()=>({idx,attempts:attempts.slice(),firstTry:firstTry.slice(),started,finished,quizOpen})};
  }
  return{mount,createAdapter,instantiate,genScope,evalExpr,fmtT,parseT,b64d,esc,fmtText,hasMath,typeset,numOf};
}

/* tf-logic:start */
function tfProblems(q,tag){
  const out=[],st=q.statements||[],filled=st.filter(s=>String(s.text||'').trim());
  if(!String(q.text||'').trim())out.push(tag+'chưa có nội dung.');
  if(filled.length<2)out.push(tag+'cần ít nhất 2 ý.');
  else if(filled.length<st.length)out.push(tag+'có ý đang để trống.');
  return out;
}
function partsOf(qs){
  const order=[],map={};
  qs.forEach(q=>{if(!q.part)return;if(!map[q.part]){map[q.part]={part:q.part,total:0,selected:0};order.push(q.part);}map[q.part].total++;if(q.sel)map[q.part].selected++;});
  return order.map(p=>map[p]);
}
/* tf-logic:end */

/* ---------- Kiểm tra dữ liệu ---------- */
function validate(){
  const out=[];
  if(project.video.type==='none')out.push('Chưa chọn video.');
  if(!project.checkpoints.length)out.push('Chưa có câu hỏi nào.');
  project.checkpoints.forEach((cp,i)=>{
    const tag='Mốc '+(i+1)+': ';
    if(!(cp.t>=0))out.push(tag+'thời điểm không hợp lệ.');
    if(!cp.items.length)out.push(tag+'chưa có câu hỏi.');
    cp.items.forEach((q,j)=>{
      const t=tag+'câu '+(j+1)+': ';
      if(q.kind==='tf'){out.push(...tfProblems(q,t));return;}
      if(!String(q.text).trim())out.push(t+'chưa có nội dung.');
      if(q.kind==='short'){
        if(!String(q.answer||'').trim())out.push(t+'chưa có đáp án.');
      }else if(q.kind==='param'){
        if(!String(q.answer).trim())out.push(t+'chưa có công thức đáp án.');
        else try{P.instantiate(q,'kiemtra',true);}catch(e){out.push(t+e.message);}
      }else{
        const ops=(q.options||[]).filter(o=>String(o.text).trim());
        if(ops.length<2)out.push(t+'cần ít nhất 2 đáp án.');
        if(!(q.options||[]).some(o=>o.ok&&String(o.text).trim()))out.push(t+'chưa chọn đáp án đúng (hoặc đáp án đúng đang để trống).');
        try{P.instantiate(q,'kiemtra',true);}catch(e){out.push(t+e.message);}
      }
    });
  });
  return out;
}
function showProblems(list){$('#problems').innerHTML=list.map(x=>'<li>'+esc(x)+'</li>').join('');}
function lessonObj(){
  const L=JSON.parse(JSON.stringify(project));
  L.checkpoints=L.checkpoints.map(cp=>({t:cp.t,items:cp.items.map(q=>{
    if(q.kind==='tf')q.statements=(q.statements||[]).filter(s=>String(s.text||'').trim());
    else if(q.kind!=='param'&&q.kind!=='short')q.options=(q.options||[]).filter(o=>String(o.text).trim());
    return q;})})).sort((a,b)=>a.t-b.t);
  return L;
}

async function makeZip(files){
  const enc=new TextEncoder(),parts=[],cdir=[];let off=0;
  const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(const f of files){
    const buf=f.data instanceof Blob?new Uint8Array(await f.data.arrayBuffer()):f.data;
    const nm=enc.encode(f.name),crc=crc32(buf),size=buf.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
    h.setUint32(14,crc,true);h.setUint32(18,size,true);h.setUint32(22,size,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,nm,buf);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
    c.setUint32(16,crc,true);c.setUint32(20,size,true);c.setUint32(24,size,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cdir.push(c.buffer,nm);off+=30+nm.length+size;
  }
  let cs=0;cdir.forEach(b=>{cs+=b.byteLength;});
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cdir,e.buffer],{type:'application/zip'});
}

function blobToDataUrl(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob);});}
async function imageToDataUrl(im){
  const blob=im instanceof Blob?im:new Blob([im.bytes],{type:im.mime});
  const mime=blob.type||im.mime;
  if(mime==='image/svg+xml'||typeof createImageBitmap!=='function')return blobToDataUrl(blob);
  try{
    const bmp=await createImageBitmap(blob),sc=Math.min(1,900/bmp.width,700/bmp.height);
    if(sc>=1&&blob.size<250000)return blobToDataUrl(blob);
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*sc));c.height=Math.max(1,Math.round(bmp.height*sc));
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
    return c.toDataURL(mime==='image/png'||mime==='image/gif'?'image/png':'image/jpeg',0.85);
  }catch(e){return blobToDataUrl(blob);}
}

   +'<button class="b" data-iact="spread">⏱ Chia đều các mốc</button><label class="chk" style="margin:0"><input type="checkbox" data-iact="all" '+(sel===n?'checked':'')+'> Chọn tất cả</label></div>'
   +(partsOf(imp.qs).length>1?'<div class="imp-bar" style="margin-top:-4px"><span class="hint" style="margin:0">Chọn theo phần:</span>'+partsOf(imp.qs).map(p=>'<label class="chk" style="margin:0"><input type="checkbox" data-iact="part" data-part="'+esc(p.part)+'" '+(p.selected===p.total?'checked':'')+'> '+esc(p.part.replace(/\s*[.:].*$/,''))+' ('+p.selected+'/'+p.total+')</label>').join('')+'</div>':'')
   +'<p class="hint">'+(d?'Video dài <b>'+fmtTP(d)+'</b>; các mốc được chia đều từ mốc đầu đến mốc cuối. ':'<b>Chưa có video</b> nên các mốc tạm đặt cách nhau 30 giây – sửa được sau. ')
   +'“Số câu mỗi mốc” lớn hơn 1: các câu trong cùng mốc là <b>câu biến thể</b>, mỗi học sinh bốc ngẫu nhiên 1 câu (chống nhắc bài). Bấm vào một đáp án để đổi đáp án đúng. Thời gian trùng với mốc đã có thì câu được thêm vào mốc đó.</p>'
   +(list||'<div class="empty-hint">Chưa chọn câu nào.</div>')+'</div>'
   +'<div class="imp-foot"><span class="hint" style="margin:0 auto 0 0">'+sel+' câu → '+groups.length+' mốc dừng</span><button class="b" data-iact="close">Huỷ</button><button class="b pri" data-iact="add" '+(sel?'':'disabled')+'>Thêm '+sel+' câu vào bài giảng</button></div>';
  P.typeset($('#iroot'));
}
function addImported(){
  const groups=impGroups();if(!groups.length)return;
  let added=0;
  groups.forEach((g,gi)=>{
    const t=imp.times[gi]||0;
    const items=g.map(q=>({kind:q.kind,text:q.text,vars:'',options:q.kind==='mcq'?q.options.map(o=>({text:o.text,ok:!!o.ok})):[],statements:q.kind==='tf'?q.statements.map(s=>({text:s.text,ok:!!s.ok})):undefined,answer:q.answer||'',tol:q.tol||0,explain:q.explain||'',images:(q.images||[]).slice()}));
    const ex=project.checkpoints.find(c=>Math.abs(c.t-t)<0.5);
    if(ex)ex.items.push(...items);else project.checkpoints.push({t:t,items:items});
    added+=items.length;
  });
  project.checkpoints.sort((a,b)=>a.t-b.t);
  renderCps();save();$('#imodal').classList.remove('on');imp=null;
  const probs=validate();showProblems(probs);
  toast('Đã thêm '+added+' câu vào '+groups.length+' mốc.'+(probs.length?' Còn '+probs.length+' điểm cần kiểm tra (xem mục 3).':''),4500);
}
$('#imodal').addEventListener('click',e=>{
  const q=e.target.closest('[data-iq="ok"]');
  if(q){
    const Q=imp.qs[+q.dataset.q],k=+q.dataset.k;
    Q.options.forEach((o,x)=>{o.ok=x===k;});Q.how='bạn chọn';
    Q.warnings=(Q.warnings||[]).filter(w=>!/đáp án đúng|Đúng hoặc Sai/.test(w));
    const card=q.closest('.iq');card.querySelectorAll('.iopt').forEach((b,x)=>b.classList.toggle('ok',x===k));
    const w=card.querySelector('.iwarn');if(w){if(Q.warnings.length)w.innerHTML=Q.warnings.map(x=>'⚠ '+esc(x)).join('<br>');else w.remove();}
    return;
  }
  const tfb=e.target.closest('[data-iq="tf"]');
  if(tfb){
    const Q=imp.qs[+tfb.dataset.q],k=+tfb.dataset.k;
    Q.statements[k].ok=tfb.dataset.v==='1';Q.how='bạn chọn';
    Q.warnings=(Q.warnings||[]).filter(w=>!/chưa xác định/.test(w));
    const card=tfb.closest('.iq');
    card.querySelectorAll('.iopt').forEach((row,x)=>{const bs=row.querySelectorAll('button');bs[0].classList.toggle('pri',!!Q.statements[x].ok);bs[1].classList.toggle('pri',!Q.statements[x].ok);});
    const w=card.querySelector('.iwarn');if(w){if(Q.warnings.length)w.innerHTML=Q.warnings.map(x=>'⚠ '+esc(x)).join('<br>');else w.remove();}
    return;
  }
  const a=e.target.closest('[data-iact]');if(!a||a.tagName==='SELECT'||a.tagName==='INPUT')return;
  if(a.dataset.iact==='close')$('#imodal').classList.remove('on');
  else if(a.dataset.iact==='spread'){spreadImport(false);renderImport();}
  else if(a.dataset.iact==='add')addImported();
});
$('#imodal').addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.iq==='sel'){imp.qs[+el.dataset.q].sel=el.checked;spreadImport(false);renderImport();return;}
  if(el.dataset.iq==='ans'){const Q=imp.qs[+el.dataset.q];Q.answer=el.value.trim();Q.warnings=(Q.warnings||[]).filter(w=>!/chưa có đáp án/.test(w));return;}
  if(el.dataset.ig!=null){const t=P.parseT(el.value);if(isNaN(t)){toast('Nhập thời gian dạng phút:giây, ví dụ 1:25');el.value=fmtTP(imp.times[+el.dataset.ig]);return;}imp.times[+el.dataset.ig]=t;el.value=fmtTP(t);return;}
  const act=el.dataset.iact;
  if(act==='k'){imp.k=+el.value;spreadImport(false);renderImport();}
  else if(act==='all'){imp.qs.forEach(q=>{q.sel=el.checked;});spreadImport(false);renderImport();}
  else if(act==='part'){imp.qs.forEach(q=>{if(q.part===el.dataset.part)q.sel=el.checked;});spreadImport(false);renderImport();}
  else if(act==='from'||act==='to'){const t=P.parseT(el.value);if(isNaN(t)){toast('Nhập thời gian dạng phút:giây, ví dụ 1:25');el.value=fmtTP(imp[act]);return;}imp[act]=t;spreadImport(false);renderImport();}
});
$('#fdocx').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)importDocxFile(f);});
$('#fimg').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!imgTarget)return;
  const q=project.checkpoints[imgTarget.i]&&project.checkpoints[imgTarget.i].items[imgTarget.j];if(!q)return;
  (q.images=q.images||[]).push(await imageToDataUrl(f));renderCps();save();
});

/* ---------- Sự kiện ---------- */
function rerenderAll(){syncStatic();renderCps();loadVideo();save();}
document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.path||el.dataset.parse==='time'||el.tagName==='SELECT')return;
  let v=el.type==='checkbox'?el.checked:(el.type==='number'?parseFloat(el.value):el.value);
  if(el.type==='number'&&isNaN(v))v=0;
  setPath(project,el.dataset.path,v);save();
  const mm=el.dataset.path.match(/^checkpoints\.(\d+)\.items\.(\d+)\./);if(mm)schedulePreview(+mm[1],+mm[2]);
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.path)return;
  if(el.dataset.parse==='time'){
    const t=P.parseT(el.value);if(isNaN(t)){toast('Nhập thời gian dạng phút:giây, ví dụ 1:25');el.value=fmtTP(project.checkpoints[+el.dataset.path.split('.')[1]].t);return;}
    setPath(project,el.dataset.path,t);project.checkpoints.sort((a,b)=>a.t-b.t);renderCps();save();return;
  }
  if(el.tagName==='SELECT'){
    setPath(project,el.dataset.path,el.value);
    const mk=el.dataset.path.match(/^checkpoints\.(\d+)\.items\.(\d+)\.kind$/);
    if(mk&&el.value==='mcq'){const q=project.checkpoints[+mk[1]].items[+mk[2]];if(!q.options||q.options.length<2)q.options=blankQ().options;}
    if(mk&&el.value==='tf'){const q=project.checkpoints[+mk[1]].items[+mk[2]];if(!q.statements||q.statements.length<2)q.statements=[0,1,2,3].map(()=>({text:'',ok:false}));}
    if(el.dataset.rerender)renderCps();save();
  }
});
document.addEventListener('click',async e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){document.querySelectorAll('.ed-tabs button').forEach(b=>b.classList.toggle('on',b===tab));
    $('#tab-edit').classList.toggle('hidden',tab.dataset.tab!=='edit');$('#tab-results').classList.toggle('hidden',tab.dataset.tab!=='results');return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,i=+b.dataset.i,j=+b.dataset.j,k=+b.dataset.k;
  const cp=project.checkpoints[i];
  switch(act){
    case 'new':if(confirm('Tạo dự án mới? Dự án hiện tại sẽ bị xoá nếu chưa lưu.')){project=newProject();videoFile=null;videoUrl='';rerenderAll();}break;
    case 'open':$('#fproj').click();break;
    case 'save':download(new Blob([JSON.stringify(project,null,1)],{type:'application/json'}),slug(project.title)+'.vtt.json');break;
    case 'pickvideo':$('#fvideo').click();break;
    case 'useyt':{const id=ytId($('#yturl').value);if(!id){toast('Link YouTube chưa đúng.');break;}
      project.video={type:'youtube',id:id};videoFile=null;videoUrl='';loadVideo();save();break;}
    case 'addcp':{
      if(project.video.type==='none'){toast('Hãy chọn video trước.');break;}
      const t=ad?Math.round(ad.time()*10)/10:0;
      project.checkpoints.push({t:t,items:[blankQ()]});project.checkpoints.sort((a,b)=>a.t-b.t);renderCps();save();
      toast('Đã thêm câu hỏi tại '+fmtTP(t));break;}
    case 'cpnow':if(ad){cp.t=Math.round(ad.time()*10)/10;project.checkpoints.sort((a,b)=>a.t-b.t);renderCps();save();}break;
    case 'cpseek':if(ad)ad.seek(Math.max(0,cp.t-0.2));break;
    case 'cpdel':if(confirm('Xoá mốc này cùng tất cả câu hỏi trong mốc?')){project.checkpoints.splice(i,1);renderCps();save();}break;
    case 'itadd':cp.items.push(blankQ());renderCps();save();break;
    case 'itdel':if(cp.items.length>1||confirm('Đây là câu cuối của mốc. Xoá luôn mốc?')){cp.items.splice(j,1);if(!cp.items.length)project.checkpoints.splice(i,1);renderCps();save();}break;
    case 'opadd':cp.items[j].options.push({text:'',ok:false});renderCps();save();break;
    case 'opdel':if(cp.items[j].options.length>2){cp.items[j].options.splice(k,1);if(!cp.items[j].options.some(o=>o.ok))cp.items[j].options[0].ok=true;renderCps();save();}else toast('Cần ít nhất 2 đáp án.');break;
    case 'tfadd':cp.items[j].statements.push({text:'',ok:false});renderCps();save();break;
    case 'tfdel':if(cp.items[j].statements.length>2){cp.items[j].statements.splice(k,1);renderCps();save();}else toast('Cần ít nhất 2 ý.');break;
    case 'setok':cp.items[j].options.forEach((o,x)=>{o.ok=(x===k);});save();break;
    case 'qtest':{
      const box=$('#qt-'+i+'-'+j);box.classList.add('on');
      try{const r=P.instantiate(cp.items[j],String(Math.random()),true);
        box.innerHTML='<b>Câu hỏi:</b> '+r.html+'<br><b>Đáp án đúng:</b> '+esc(r.correct);}
      catch(err){box.innerHTML='<span style="color:#b91c1c">Lỗi: '+esc(err.message)+'</span>';}
      break;}
    case 'preview':openPreview();break;
    case 'importdocx':$('#fdocx').click();break;
    case 'imgadd':imgTarget={i:i,j:j};$('#fimg').click();break;
    case 'imgdel':cp.items[j].images.splice(k,1);renderCps();save();break;
    case 'exportzip':doExport('zip');break;
    case 'exportone':doExport('one');break;
    case 'exportyt':doExport('yt');break;
    case 'exportytzip':doExport('ytzip');break;
    case 'parse':parseCodes();break;
    case 'csv':csv();break;
  }
});
$('#fvideo').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  if(videoUrl)URL.revokeObjectURL(videoUrl);
  videoFile=f;videoUrl=URL.createObjectURL(f);project.video={type:'file',name:f.name};loadVideo();save();e.target.value='';
});
$('#fproj').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const p=JSON.parse(await f.text());if(!p||!Array.isArray(p.checkpoints))throw new Error('Không phải file dự án.');
    project=Object.assign(newProject(),p);project.settings=Object.assign(newProject().settings,p.settings||{});
    videoFile=null;videoUrl='';rerenderAll();toast('Đã mở dự án'+(project.video.type==='file'?'. Hãy chọn lại file video.':''),3500);}
  catch(err){toast('Không mở được: '+err.message);}
  e.target.value='';
});

/* ---------- Khởi động ---------- */
try{const s=localStorage.getItem(KEY);if(s){const p=JSON.parse(s);if(p&&Array.isArray(p.checkpoints)){project=Object.assign(newProject(),p);project.settings=Object.assign(newProject().settings,p.settings||{});}}}catch(e){}
rerenderAll();
window.__app={get project(){return project;},set project(p){project=p;rerenderAll();},setVideoFile:f=>{videoFile=f;videoUrl=URL.createObjectURL(f);project.video={type:'file',name:f.name};loadVideo();},buildZip,buildYtZip,lessonObj,validate,openPreview,closePreview,buildHtml,P,importDocxFile,addImported,get imp(){return imp;},lessonUsesMath};
})();
</script>
